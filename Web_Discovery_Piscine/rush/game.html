  <main>
    <button id="themeToggleBtn"
      class="btn btn-dark position-fixed bottom-0 start-0 m-3 rounded-circle p-2 d-flex align-items-center justify-content-center"
      title="Toggle theme">
      <img id="themeIcon" src="https://img.icons8.com/?size=20&id=1x4dA4gXbFjF&format=png" alt="Toggle theme icon"
        width="20" height="20">
    </button>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const themeIcons = {
        light: 'https://img.icons8.com/?size=50&id=660&format=png&color=ffffff', // Moon (switch to dark)
        dark: 'https://img.icons8.com/?size=50&id=648&format=png'             // Sun (switch to light)
      };
      const btn = document.getElementById('themeToggleBtn');
      const icon = document.getElementById('themeIcon');
      function setTheme(theme) {
        document.documentElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem('bs-theme', theme);
        icon.src = themeIcons[theme];
        icon.alt = theme === 'dark' ? 'Light mode icon' : 'Dark mode icon';
        btn.classList.remove('bg-light', 'bg-dark');
        btn.classList.add(theme === 'dark' ? 'bg-light' : 'bg-dark');
      }
      setTheme(localStorage.getItem('bs-theme') || 'dark');
      btn.addEventListener('click', () => setTheme(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'));
    });
  </script>
</body>
