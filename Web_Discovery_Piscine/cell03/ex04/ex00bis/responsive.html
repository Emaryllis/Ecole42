<!DOCTYPE html>
<head>
    <style>
        body {
            margin: 0;
        }
        table {
            width: 100%;
            height: 50px; /* Only for visualization */
            padding: 0;
        }
        td {
            width: 50%;
        }
        .bg-pink { 
            background-color: pink;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(() => $('td').eq(1).addClass('bg-pink'));
    </script>
</head>
<body>
    <table>
        <tr>
            <td>Hello World</td>
            <td />
        </tr>
    </table>
</body>
</html>
