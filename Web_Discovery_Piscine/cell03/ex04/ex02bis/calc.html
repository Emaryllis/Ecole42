<!DOCTYPE html>
<head>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, hsl(340, 100%, 95%), hsl(340, 90%, 85%));
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .calculator-card {
            background-color: white;
            padding: 30px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .calculator-card h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            color: hsl(0, 0%, 20%);
        }
        .calculator-form {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .calculator-form input[type="text"],
        .calculator-form select {
            padding: 10px;
            font-size: 1rem;
            width: 80px;
            text-align: center;
            border: 1px solid hsl(0, 0%, 80%);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }
        .calculator-form input[type="text"]:focus,
        .calculator-form select:focus {
            border-color: hsl(330, 90%, 70%);
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: hsl(330, 90%, 70%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }
        input[type="submit"]:hover {
            background-color: hsl(330, 80%, 60%);
            transform: translateY(-2px);
        }
        @media (max-width: 500px) {
            .calculator-form {
                flex-direction: column;
                align-items: center;
            }
            .calculator-form input,
            .calculator-form select {
                width: 100%;
            }
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="calculator-card">
        <h1>Calculator</h1>
        <form class="calculator-form" id="calculator-form">
            <input type="text" id="left" placeholder="0" />
            <select id="operator">
                <option value="+">+</option>
                <option value="-">−</option>
                <option value="*">×</option>
                <option value="/">÷</option>
                <option value="%">%</option>
            </select>
            <input type="text" id="right" placeholder="0" />
            <input type="submit" value="Try me!" />
        </form>
    </div>
    <script>
        const calculate = () => {
            const left = $('#left').val().trim();
            const right = $('#right').val().trim();
            const operator = $('#operator').val();
            const isValid = /^\d+$/.test(left) && /^\d+$/.test(right);
            if (!isValid) {
                alert("Error :(");
                return false;
            }
            const num1 = parseInt(left, 10);
            const num2 = parseInt(right, 10);
            let result;
            if ((operator === '/' || operator === '%') && num2 === 0) {
                alert("It's over 9000!");
                console.log("It's over 9000!");
                return false;
            }
            switch (operator) {
                case '+':
                    result = num1 + num2;
                    break;
                case '-':
                    result = num1 - num2;
                    break;
                case '*':
                    result = num1 * num2;
                    break;
                case '/':
                    result = num1 / num2;
                    break;
                case '%':
                    result = num1 % num2;
                    break;
            }
            alert(result);
            console.log(result);
            return false;
        };
        $(() => { // Wrapping in a nameless function to ensure DOM is loaded.
            $('#calculator-form').on('submit', e => {
                e.preventDefault();
                return calculate();
            });
            setInterval(() => alert("Please, use me..."), 30000);
        });
    </script>
</body>
