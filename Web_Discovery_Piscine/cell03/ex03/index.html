<!DOCTYPE html>
<head>
    <style>
		body {
			font-family: sans-serif;
			background-color: #fce4ec;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 40px;
		}
		#new-btn {
			background-color: #ec407a;
			color: white;
			border: none;
			padding: 12px 25px;
			font-size: 1rem;
			border-radius: 8px;
			cursor: pointer;
			margin-bottom: 30px;
			transition: background-color 0.3s ease;
		}
		#new-btn:hover {
			background-color: #d81b60;
		}
		#ft_list {
			width: 300px;
			display: flex;
			flex-direction: column-reverse;
			gap: 10px;
		}
		.todo-item {
			display: flex;
			justify-content: space-between;
			align-items: center;
			background-color: #fff;
			padding: 15px;
			border-radius: 6px;
			box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
			cursor: pointer;
			transition: transform 0.1s ease;
		}

		.todo-item:hover {
			transform: scale(1.02);
		}
		.trash-icon {
			cursor: pointer;
			font-size: 1.2rem;
			padding-left: 10px;
			transition: color 0.2s ease;
			}

		.trash-icon:hover {
			color: #e53935;
		}
    </style>
</head>
<body>
	<button id="new-btn">New</button>
	<div id="ft_list"></div>
	<script src="todo.js"></script>
</body>
